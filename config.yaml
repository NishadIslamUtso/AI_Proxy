# brain-proxy configuration
host: 127.0.0.1
port: 8000
default: chatgpt

helper:
  enabled: true
  mode: hermes_cli
  cli_argv:
    - "C:/Users/Nishad Islam Utso/AppData/Local/hermes/hermes-agent/.hermes/bin/hermes.exe"
    - "chat"
    - "--model"
    - "qwen/qwen4-max:free"
    - "-Q"
    - "-q"
    - "{prompt}"
  cli_env:
    HERMES_PROXY_GUARD: "1"
    HERMES_MODEL_PROVIDER: "nous"
    HERMES_MODEL_DEFAULT: "qwen/qwen4-max:free"
  cli_timeout_seconds: 240
  role_prompt: |
    You are a helper subprocess inside an agent framework.
    Rules, enforced:
    - Do not converse. Do not greet. Do not explain.
    - Do not give opinions, preferences, recommendations, or commentary.
    - Do not write apologies, preambles, or "here is...".
    - Reply with exactly the JSON or text the caller asked for.
    - If you cannot produce it, reply with {"error":"cannot"}.
  tool_format_prompt: |
    You are a tool-call formatter. Given a user request and a tools list,
    return EXACTLY one JSON object on its own:
      {"tool": "<name>", "args": { ... }}
    or, if no tool applies:
      {"final": "<plain answer>"}
    No prose. No code fences. No commentary. Just the JSON.
  trigger_on:
    - tool_json_missing
    - rate_limited
    - captcha
    - auth_wall
    - site_changed
    - consent_wall
    - paused
    - proxy_escalation_failed
    - hard_timeout

hard_timeout_seconds: 120

# Turn budget per web chat thread. At the limit the proxy asks the brain for a
# summary, opens a fresh chat, and seeds it with that summary.
max_turns_per_thread: 40
reanchor_every: 10

# Try these brains in order when one fails.
escalation: []
escalation_enabled: false
max_concurrent: 4
max_wait_seconds: 120

# Site conditions the proxy resolves by itself, without bothering you.
# Each entry: id, phrases (matched against the page text), action, max tries.
# Actions: reprompt | continue | refresh | new_session | click
#
# The built-in defaults already cover the four failures these sites actually
# produce: running out of memory, stopping at the per-turn tool-call limit,
# filling the workspace, and an expired session. Add entries here for other
# sites - they are appended to the defaults, not a replacement.
#
# recovery:
#   - id: weird_site_quota
#     phrases: ["you are out of credits", "upgrade to continue"]
#     action: reprompt
#     max: 2
recovery: []

# How many extra session slots each brain exposes, as `<brain>#2`, `<brain>#3`.
# A slot is a manual handle on a thread: two clients on different slots never
# share a conversation, which is how you keep one Hermes session apart from
# another. 0 disables the aliases.
session_slots: 3

# The browser the proxy drives. Dedicated profile + dedicated CDP port so it
# never fights Hermes's own browser (which is on 9222).
browser:
  user_data_dir: "C:/hermes/brain-proxy/profile"
  executable_path: "C:/Users/Nishad Islam Utso/AppData/Local/BraveSoftware/Brave-Browser/Application/brave.exe"
  # Ask Chromium for its sandbox. Patchright/Playwright otherwise start it
  # with --no-sandbox, which shows up in the browser's own command line and
  # to the target sites. Set to false only if the machine cannot sandbox.
  sandbox: true

# Per-tool truncation. Tool output longer than this is head+tail trimmed.
tool_truncation:
  read_file: 8000
  run_cmd: 6000
  grep: 8000
  list_dir: 8000
  default: 8000

brains:
  chatgpt:
    url: "https://chatgpt.com/"
    input_selectors:
      - ".ProseMirror"
      - "div#prompt-textarea"
      - "div[contenteditable='true']"
    response_selectors:
      - "div[data-message-author-role='assistant']"
    submit_selectors:
      - "button[data-testid='send-button']"
      - "button[type='submit']"
    submit_key: "Enter"
    strip_patterns:
      - "^Show full message\\s*\\n+"
      - "\\n+Show full message\\s*$"
    done_when_gone:
      - "button[data-testid='stop-button']"
  arena-chat:
    url: "https://arena.ai/chat"
    input_selectors:
      - ".tiptap.ProseMirror"
      - "div.tiptap[contenteditable='true']"
      - "main div[contenteditable='true']"
    response_selectors:
      - "div:not(.bg-surface-raised):not(.editor-content) > .prose:not(.tiptap)"
      - "main .prose.prose-sm:not(.tiptap)"
      - ".prose.prose-sm:not(.tiptap)"
    submit_selectors:
      - "button[aria-label='Send message']"
      - "button[aria-label*='Send']"
      - "form button[type='submit']"
    submit_key: "Enter"
    strip_patterns:
      - "^Thought for \\d+\\s*(?:second|minute)s?\\s*\\n+"
      - "^Thinking\\.{0,3}\\s*\\n+"
      - "\\n+\\d+s\\s*\\|\\s*(?:just now|\\d+m ago)\\s*$"
    done_when_gone:
      - "button[aria-label*='Stop']"
  arena-code:
    url: "https://arena.ai/code"
    input_selectors:
      - ".tiptap.ProseMirror"
      - "div.tiptap[contenteditable='true']"
      - "main div[contenteditable='true']"
    response_selectors:
      - "main .prose:not(.tiptap)"
      - "main [class*='markdown']:not(.tiptap)"
    submit_selectors:
      - "button[aria-label*='Send']"
      - "form button[type='submit']"
    submit_key: "Enter"
    done_when_gone:
      - "button[aria-label*='Stop']"
  arena-gpt5:
    url: "https://arena.ai/code/direct?model_a=gpt-5-high"
    input_selectors:
      - ".tiptap.ProseMirror"
      - "div.tiptap[contenteditable='true']"
      - "main div[contenteditable='true']"
    response_selectors:
      - "main .prose:not(.tiptap)"
      - "main [class*='markdown']:not(.tiptap)"
    submit_selectors:
      - "button[aria-label*='Send']"
      - "form button[type='submit']"
    submit_key: "Enter"
    done_when_gone:
      - "button[aria-label*='Stop']"
  arena-agent:
    url: "https://arena.ai/agent"
    mode: agent
    agent_deadline: 7200
    # Arena's agent has its own workspace and shell, so it does the work there
    # instead of round-tripping every command through Hermes - which is the
    # point: fewer tokens and less work on your machine.
    #
    # An empty list means "offer no tools at all": the brain acts autonomously
    # in its own workspace and Hermes only relays its answer. List tool names
    # to give it access back to your device, e.g.
    #   advertise_tools: [terminal, read_file, write_file, search_files]
    # Brains with no workspace of their own (chatgpt, deepseek, zai) should
    # leave this unset so they are offered everything.
    advertise_tools: []
    input_selectors:
      - ".tiptap.ProseMirror"
      - "div.tiptap[contenteditable='true']"
      - "main div[contenteditable='true']"
    response_selectors:
      - "main .prose:not(.tiptap)"
      - "main [class*='markdown']:not(.tiptap)"
    submit_selectors:
      - "button[aria-label*='Send']"
      - "form button[type='submit']"
    submit_key: "Enter"
    done_when_gone:
      - "button[aria-label*='Stop']"
      - "button[aria-label*='Cancel']"
      - "[data-state='streaming']"
  deepseek:
    url: "https://chat.deepseek.com/"
    mode: chat
    input_selectors:
      - "#chat-input"
      - "textarea[placeholder*='Send a message']"
      - "textarea[data-testid='chat-input']"
      - "div[contenteditable][role='textbox']"
      - "textarea"
    response_selectors:
      - "div.ds-markdown:last-of-type"
      - ".ds-markdown"
      - "[class*='markdown']"
    submit_selectors:
      - "button[aria-label*='Send']"
      - "button[type='submit']"
      - "div[role='button'][aria-label*='Send']"
    submit_key: "Enter"
    strip_patterns:
      - "^Thought for \\d+\\s*(?:second|minute)s?\\s*\\n+"
      - "^Thinking\\.{0,3}\\s*\\n+"
      - "\\n+(?:DeepThink|Search|R1)\\s*$"
      - "\\n+AI-generated, for reference only\\s*$"
    done_when_gone: []
    auth_urls:
      - "/sign_in"
      - "/signin"
    auth_selectors:
      - "button:has-text('Log in')"
      - "a[href*='sign_in']"
  zai:
    url: "https://chat.z.ai/"
    mode: chat
    input_selectors:
      - "#chat-input"
      - "textarea[placeholder='Send a Message']"
      - "textarea"
    response_selectors:
      - ".chat-assistant .chat-markdown"
      - ".chat-markdown"
      - ".chat-assistant.markdown-prose"
      - ".markdown-prose"
    submit_selectors:
      - "button[aria-label='Send Message']"
      - "button[type='submit']"
    submit_key: "Enter"
    done_when_gone:
      - "button[aria-label='Stop']"
    strip_patterns:
      - "^Show full message\\s*\\n+"
      - "\\n+Show full message\\s*$"
      - "^Thought for \\d+\\s*(?:second|minute)s?\\s*\\n+"
      - "^Thinking\\.{0,3}\\s*\\n+"
      - "^Thought Process\\s*\\n+"
      - "\\n+Connect IM[\\s\\S]*$"
      - "\\n+Generated by AI[\\s\\S]*$"
